<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tableau">
<title>Tableau de bord</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0d10; color: #e9ecef;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; overflow: hidden; }
  body { -webkit-transition: opacity 2s; transition: opacity 2s; }
  body.dim { opacity: .35; }
  .flex { display: -webkit-flex; display: flex; }
  .col { -webkit-flex-direction: column; flex-direction: column; }
  .grow { -webkit-flex: 1; flex: 1; min-height: 0; min-width: 0; }
  .wrap { height: 100%; padding: 20px; }
  .card { background: #14171b; border-radius: 16px; padding: 16px 20px; }
  h2 { font-size: 13px; font-weight: 600; color: #6c757d; text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 8px; }

  /* Haut : heure + météo actuelle */
  .top { margin-bottom: 16px; -webkit-align-items: stretch; align-items: stretch; }
  .clock { -webkit-flex: 1.25; flex: 1.25; margin-right: 16px; -webkit-justify-content: center; justify-content: center; }
  .time { font-size: 120px; font-weight: 200; letter-spacing: -4px; line-height: .95; }
  .sec { font-size: 36px; color: #6c757d; letter-spacing: 0; margin-left: 6px; }
  .date { font-size: 26px; color: #adb5bd; margin-top: 6px; }
  .now { -webkit-flex: 1; flex: 1; -webkit-align-items: center; align-items: center; }
  .icon { font-size: 72px; margin-right: 16px; }
  .temp { font-size: 64px; font-weight: 300; line-height: 1; }
  .desc { font-size: 18px; color: #adb5bd; margin-top: 6px; }
  .minmax { font-size: 16px; color: #6c757d; margin-top: 4px; }

  /* Bas : agenda + prévisions */
  .agenda { -webkit-flex: 1.25; flex: 1.25; margin-right: 16px; overflow: hidden; }
  .side { -webkit-flex: 1; flex: 1; }
  .next { background: #1c2a3a; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
  .next .lbl { font-size: 13px; color: #74c0fc; text-transform: uppercase; letter-spacing: 2px; }
  .next .ttl { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .next .info { font-size: 16px; color: #adb5bd; margin-top: 2px; }
  .day { margin-top: 10px; }
  .ev { -webkit-align-items: center; align-items: center; padding: 8px 0; border-bottom: 1px solid #1f2328; }
  .ev:last-child { border-bottom: 0; }
  .ev .bar { width: 5px; height: 34px; border-radius: 3px; margin-right: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .ev .when { width: 84px; font-size: 17px; color: #adb5bd; -webkit-flex-shrink: 0; flex-shrink: 0; line-height: 1.15; }
  .ev .when small { font-size: 13px; color: #6c757d; }
  .ev .ttl { font-size: 19px; }
  .ev .loc { font-size: 14px; color: #6c757d; }
  .ev.past { opacity: .35; }
  .ev.live .ttl { color: #fff; font-weight: 600; }
  .empty { color: #495057; font-size: 17px; padding: 6px 0; }

  .hours { margin-bottom: 16px; }
  .hr { -webkit-align-items: center; align-items: center; -webkit-flex: 1; flex: 1; border-bottom: 1px solid #1f2328; }
  .hr:last-child { border-bottom: 0; }
  .hr .t { width: 52px; font-size: 16px; color: #6c757d; }
  .hr .i { width: 40px; font-size: 22px; }
  .hr .v { -webkit-flex: 1; flex: 1; font-size: 19px; }
  .hr .p { font-size: 14px; color: #4dabf7; }
  .dl { -webkit-align-items: center; align-items: center; padding: 6px 0; }
  .dl .n { width: 90px; font-size: 17px; color: #adb5bd; text-transform: capitalize; }
  .dl .i { width: 40px; font-size: 24px; }
  .dl .v { -webkit-flex: 1; flex: 1; font-size: 18px; }
  .dl .v span { color: #6c757d; }
  .dl .p { font-size: 14px; color: #4dabf7; }

  .status { position: fixed; right: 12px; bottom: 4px; font-size: 11px; color: #343a40; }
  .status.err { color: #e03131; }

  @media (orientation: portrait) {
    .bottom { -webkit-flex-direction: column; flex-direction: column; }
    .agenda { margin-right: 0; margin-bottom: 16px; }
    .side { -webkit-flex: none; flex: none; -webkit-flex-direction: row; flex-direction: row; }
    .hours { margin-bottom: 0; margin-right: 16px; }
    .side > .card { -webkit-flex: 1; flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap flex col">
  <div class="top flex">
    <div class="clock card flex col">
      <div class="time"><span id="hm">--:--</span><span class="sec" id="s"></span></div>
      <div class="date" id="date"></div>
    </div>
    <div class="now card flex">
      <div class="icon" id="wIcon"></div>
      <div>
        <div class="temp" id="wTemp">--°</div>
        <div class="desc" id="wDesc"></div>
        <div class="minmax" id="wMinMax"></div>
      </div>
    </div>
  </div>
  <div class="bottom flex grow">
    <div class="agenda card" id="agenda"><h2>Agenda</h2><div class="empty">Chargement…</div></div>
    <div class="side flex col">
      <div class="hours card flex col grow"><h2>Prochaines heures</h2><div class="flex col grow" id="hours"></div></div>
      <div class="card"><h2>Prochains jours</h2><div id="days"></div></div>
    </div>
  </div>
</div>
<div class="status" id="status"></div>

<script>
// ES5 uniquement (Safari des vieux iPad)
var JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var DATA = null;

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function wmo(code, day) {
  var c = code;
  if (c === 0) return [day ? '☀️' : '🌙', 'Ciel dégagé'];
  if (c === 1) return [day ? '🌤️' : '🌙', 'Plutôt dégagé'];
  if (c === 2) return ['⛅', 'Partiellement nuageux'];
  if (c === 3) return ['☁️', 'Couvert'];
  if (c === 45 || c === 48) return ['🌫️', 'Brouillard'];
  if (c >= 51 && c <= 57) return ['🌦️', 'Bruine'];
  if (c >= 61 && c <= 67) return ['🌧️', 'Pluie'];
  if (c >= 71 && c <= 77) return ['🌨️', 'Neige'];
  if (c >= 80 && c <= 82) return ['🌦️', 'Averses'];
  if (c === 85 || c === 86) return ['🌨️', 'Averses de neige'];
  if (c >= 95) return ['⛈️', 'Orage'];
  return ['❔', ''];
}

function tick() {
  var d = new Date();
  document.getElementById('hm').textContent = hm(d);
  document.getElementById('s').textContent = pad(d.getSeconds());
  document.getElementById('date').textContent =
    cap(JOURS[d.getDay()]) + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
  var h = d.getHours();
  document.body.className = (h >= 23 || h < 6) ? 'dim' : '';
  if (d.getSeconds() === 0 && DATA) renderAgenda(); // met à jour "passé / en cours / dans X"
}

function renderWeather(w) {
  if (!w || !w.current) return;
  var cur = w.current, ic = wmo(cur.weather_code, cur.is_day), dl = w.daily;
  document.getElementById('wIcon').textContent = ic[0];
  document.getElementById('wTemp').textContent = Math.round(cur.temperature_2m) + '°';
  document.getElementById('wDesc').textContent = ic[1] + ' · ressenti ' + Math.round(cur.apparent_temperature) + '°';
  document.getElementById('wMinMax').innerHTML = 'Vent ' + Math.round(cur.wind_speed_10m) + ' km/h · ☀ ' +
    dl.sunrise[0].slice(11) + ' – ' + dl.sunset[0].slice(11);

  var hr = w.hourly, curHour = cur.time.slice(0, 13), i0 = 0, html = '';
  for (var i = 0; i < hr.time.length; i++) { if (hr.time[i].slice(0, 13) >= curHour) { i0 = i + 1; break; } }
  for (var k = i0; k < i0 + 7 && k < hr.time.length; k++) {
    var hi = wmo(hr.weather_code[k], hr.is_day[k]), p = hr.precipitation_probability[k];
    html += '<div class="hr flex"><div class="t">' + hr.time[k].slice(11, 13) + 'h</div><div class="i">' + hi[0] +
      '</div><div class="v">' + Math.round(hr.temperature_2m[k]) + '°</div><div class="p">' +
      (p >= 20 ? '💧 ' + p + '%' : '') + '</div></div>';
  }
  document.getElementById('hours').innerHTML = html;

  html = '';
  for (var j = 0; j < dl.time.length && j < 3; j++) {
    var di = wmo(dl.weather_code[j], 1), dd = new Date(dl.time[j] + 'T12:00:00');
    var name = j === 0 ? "Aujourd'hui" : (j === 1 ? 'Demain' : JOURS[dd.getDay()]);
    html += '<div class="dl flex"><div class="n">' + name + '</div><div class="i">' + di[0] + '</div><div class="v">' +
      Math.round(dl.temperature_2m_max[j]) + '° <span>/ ' + Math.round(dl.temperature_2m_min[j]) + '°</span></div>' +
      '<div class="p">' + (dl.precipitation_probability_max[j] >= 20 ? '💧 ' + dl.precipitation_probability_max[j] + '%' : '') +
      '</div></div>';
  }
  document.getElementById('days').innerHTML = html;
}

function dans(ms) {
  var m = Math.round(ms / 60000);
  if (m < 60) return 'dans ' + m + ' min';
  var h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return 'dans ' + h + ' h' + (r ? ' ' + pad(r) : '');
  return 'dans ' + Math.round(h / 24) + ' j';
}

function evHtml(e, now) {
  var s = new Date(e.start), en = new Date(e.end);
  var cls = 'ev flex' + (e.end <= now ? ' past' : (e.start <= now ? ' live' : ''));
  var when = e.allDay ? 'Journée' : hm(s) + '<br><small>' + hm(en) + '</small>';
  return '<div class="' + cls + '"><div class="bar" style="background:' + esc(e.color) + '"></div>' +
    '<div class="when">' + when + '</div><div class="grow"><div class="ttl">' + esc(e.title) + '</div>' +
    (e.location ? '<div class="loc">' + esc(e.location) + '</div>' : '') + '</div></div>';
}

function renderAgenda() {
  var now = Date.now(), t0 = dayStart(new Date()), d1 = t0 + 86400000, d2 = d1 + 86400000, d3 = d2 + 86400000;
  var groups = [[], [], []], next = null;
  for (var i = 0; i < DATA.events.length; i++) {
    var e = DATA.events[i];
    if (/^Semaine \d+/.test(e.title)) continue; // numéros de semaine masqués
    if (!next && !e.allDay && e.end > now) next = e;
    if (e.start < d1 && e.end > t0) groups[0].push(e);
    else if (e.start >= d1 && e.start < d2) groups[1].push(e);
    else if (e.start >= d2 && e.start < d3) groups[2].push(e);
  }
  var html = '';
  if (next) {
    var ns = new Date(next.start), live = next.start <= now;
    var jour = next.start < d1 ? '' : (next.start < d2 ? 'demain ' : JOURS[ns.getDay()] + ' ');
    html += '<div class="next"><div class="lbl">' + (live ? 'En cours' : 'Prochain') + '</div>' +
      '<div class="ttl">' + esc(next.title) + '</div><div class="info">' +
      (live ? "jusqu'à " + hm(new Date(next.end)) : jour + hm(ns) + ' · ' + dans(next.start - now)) +
      (next.location ? ' · ' + esc(next.location) : '') + '</div></div>';
  }
  var after = new Date(d2);
  var titles = ["Aujourd'hui", 'Demain', cap(JOURS[after.getDay()]) + ' ' + after.getDate()];
  for (var g = 0; g < 3; g++) {
    if (g === 2 && !groups[2].length) continue;
    html += '<div class="day"><h2>' + titles[g] + '</h2>';
    if (!groups[g].length) html += '<div class="empty">Rien de prévu</div>';
    for (var j = 0; j < groups[g].length; j++) html += evHtml(groups[g][j], now);
    html += '</div>';
  }
  document.getElementById('agenda').innerHTML = html;
}

// L'identifiant du script Google est dans le lien (#AKfy...), jamais dans ce fichier public.
function scriptId() {
  var h = (location.hash || '').replace(/^#/, '');
  try {
    if (h) localStorage.setItem('dash-id', h); else h = localStorage.getItem('dash-id') || '';
  } catch (e) {}
  return h;
}

function setStatus(txt, err) {
  var st = document.getElementById('status');
  st.className = 'status' + (err ? ' err' : '');
  st.textContent = txt;
}

var reqN = 0;
function load() {
  var id = scriptId();
  if (!id) {
    document.getElementById('agenda').innerHTML =
      '<h2>Configuration</h2><div class="empty">Ajoute l\'identifiant du script Google à la fin du lien : #AKfy…</div>';
    return;
  }
  var cbName = 'dashCb' + (++reqN), done = false;
  var s = document.createElement('script');
  function cleanup() {
    window[cbName] = function () {};
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  window[cbName] = function (d) {
    done = true; cleanup();
    DATA = d;
    renderWeather(d.weather);
    renderAgenda();
    setStatus('MAJ ' + hm(new Date()), false);
  };
  s.onerror = function () { if (!done) { done = true; cleanup(); setStatus('Hors ligne — nouvel essai bientôt', true); } };
  setTimeout(function () { if (!done) { done = true; cleanup(); setStatus('Pas de réponse — nouvel essai bientôt', true); } }, 60000);
  s.src = 'https://script.google.com/macros/s/' + encodeURIComponent(id) + '/exec?callback=' + cbName + '&t=' + Date.now();
  document.body.appendChild(s);
}

tick();
setInterval(tick, 1000);
load();
setInterval(load, 10 * 60 * 1000);                                   // données toutes les 10 min
// Toucher l'écran ou revenir sur l'app = mise à jour immédiate (max 1 fois / 15 s)
var lastTap = 0;
function refreshNow() {
  var t = Date.now();
  if (t - lastTap < 15000) return;
  lastTap = t;
  setStatus('Mise à jour…', false);
  load();
}
document.addEventListener('touchend', refreshNow, false);
document.addEventListener('click', refreshNow, false);
document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshNow(); }, false);
window.addEventListener('pageshow', function (e) { if (e.persisted) refreshNow(); }, false);
setTimeout(function () { try { window.location.reload(); } catch (e) {} }, 6 * 3600 * 1000); // rechargement complet toutes les 6 h
</script>
</body>
</html>
