<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tableau">
<title>Tableau de bord</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0d10; color: #e9ecef;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; overflow: hidden; }
  body { -webkit-transition: opacity 2s; transition: opacity 2s; }
  body.dim { opacity: .35; }
  .wrap { display: -webkit-flex; display: flex; height: 100%; padding: 28px; }
  .left { -webkit-flex: 1.1; flex: 1.1; display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column; padding-right: 28px; }
  .right { -webkit-flex: 1; flex: 1; border-left: 1px solid #22262c; padding-left: 28px; overflow: hidden; }
  .time { font-size: 150px; font-weight: 200; letter-spacing: -4px; line-height: 1; }
  .sec { font-size: 40px; color: #6c757d; letter-spacing: 0; margin-left: 6px; }
  .date { font-size: 30px; color: #adb5bd; margin-top: 8px; text-transform: capitalize; }
  .wx { margin-top: auto; }
  .now { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .icon { font-size: 84px; margin-right: 18px; }
  .temp { font-size: 76px; font-weight: 300; }
  .desc { font-size: 22px; color: #adb5bd; margin-top: 4px; }
  .minmax { font-size: 20px; color: #6c757d; margin-top: 4px; }
  .hours { display: -webkit-flex; display: flex; margin-top: 22px; }
  .h { -webkit-flex: 1; flex: 1; text-align: center; background: #14171b; border-radius: 12px;
    padding: 10px 0; margin-right: 8px; }
  .h:last-child { margin-right: 0; }
  .h .t { font-size: 15px; color: #6c757d; }
  .h .i { font-size: 28px; margin: 4px 0; }
  .h .v { font-size: 19px; }
  .h .p { font-size: 13px; color: #4dabf7; height: 16px; }
  h2 { font-size: 15px; font-weight: 600; color: #6c757d; text-transform: uppercase;
    letter-spacing: 2px; margin: 4px 0 12px; }
  h2.more { margin-top: 26px; }
  .ev { display: -webkit-flex; display: flex; padding: 12px 0; border-bottom: 1px solid #1b1f24; }
  .ev .bar { width: 5px; border-radius: 3px; margin-right: 14px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .ev .when { width: 92px; font-size: 18px; color: #adb5bd; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .ev .ttl { font-size: 21px; }
  .ev .loc { font-size: 15px; color: #6c757d; margin-top: 2px; }
  .ev.past { opacity: .35; }
  .ev.live .ttl { color: #fff; font-weight: 600; }
  .empty { color: #495057; font-size: 19px; padding: 10px 0; }
  .status { position: fixed; right: 12px; bottom: 8px; font-size: 12px; color: #343a40; }
  .status.err { color: #e03131; }
  @media (orientation: portrait) {
    .wrap { -webkit-flex-direction: column; flex-direction: column; }
    .left { padding-right: 0; -webkit-flex: none; flex: none; }
    .wx { margin-top: 28px; }
    .right { border-left: 0; border-top: 1px solid #22262c; padding: 24px 0 0; margin-top: 28px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="time"><span id="hm">--:--</span><span class="sec" id="s"></span></div>
    <div class="date" id="date"></div>
    <div class="wx">
      <div class="now">
        <div class="icon" id="wIcon"></div>
        <div>
          <div class="temp" id="wTemp">--°</div>
          <div class="desc" id="wDesc"></div>
          <div class="minmax" id="wMinMax"></div>
        </div>
      </div>
      <div class="hours" id="hours"></div>
    </div>
  </div>
  <div class="right" id="agenda"><h2>Aujourd'hui</h2><div class="empty">Chargement…</div></div>
</div>
<div class="status" id="status"></div>

<script>
// ES5 uniquement (Safari des vieux iPad)
var JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var DATA = null;

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

function wmo(code, day) {
  var c = code;
  if (c === 0) return [day ? '☀️' : '🌙', 'Ciel dégagé'];
  if (c === 1) return [day ? '🌤️' : '🌙', 'Plutôt dégagé'];
  if (c === 2) return ['⛅', 'Partiellement nuageux'];
  if (c === 3) return ['☁️', 'Couvert'];
  if (c === 45 || c === 48) return ['🌫️', 'Brouillard'];
  if (c >= 51 && c <= 57) return ['🌦️', 'Bruine'];
  if (c >= 61 && c <= 67) return ['🌧️', 'Pluie'];
  if (c >= 71 && c <= 77) return ['🌨️', 'Neige'];
  if (c >= 80 && c <= 82) return ['🌦️', 'Averses'];
  if (c === 85 || c === 86) return ['🌨️', 'Averses de neige'];
  if (c >= 95) return ['⛈️', 'Orage'];
  return ['❔', ''];
}

function tick() {
  var d = new Date();
  document.getElementById('hm').textContent = hm(d);
  document.getElementById('s').textContent = pad(d.getSeconds());
  document.getElementById('date').textContent =
    JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
  var h = d.getHours();
  document.body.className = (h >= 23 || h < 6) ? 'dim' : '';
  if (d.getSeconds() === 0 && DATA) renderAgenda(); // met à jour "passé / en cours"
}

function renderWeather(w) {
  if (!w || !w.current) return;
  var cur = w.current, ic = wmo(cur.weather_code, cur.is_day);
  document.getElementById('wIcon').textContent = ic[0];
  document.getElementById('wTemp').textContent = Math.round(cur.temperature_2m) + '°';
  document.getElementById('wDesc').textContent = ic[1] + ' · ressenti ' + Math.round(cur.apparent_temperature) +
    '° · vent ' + Math.round(cur.wind_speed_10m) + ' km/h';
  var dl = w.daily;
  document.getElementById('wMinMax').textContent = 'Min ' + Math.round(dl.temperature_2m_min[0]) +
    '° · Max ' + Math.round(dl.temperature_2m_max[0]) + '° · Pluie ' + dl.precipitation_probability_max[0] +
    '% · ☀ ' + dl.sunrise[0].slice(11) + ' – ' + dl.sunset[0].slice(11);

  var hr = w.hourly, curHour = cur.time.slice(0, 13), i0 = 0, html = '';
  for (var i = 0; i < hr.time.length; i++) { if (hr.time[i].slice(0, 13) >= curHour) { i0 = i + 1; break; } }
  for (var k = i0; k < i0 + 6 && k < hr.time.length; k++) {
    var hi = wmo(hr.weather_code[k], hr.is_day[k]), p = hr.precipitation_probability[k];
    html += '<div class="h"><div class="t">' + hr.time[k].slice(11, 13) + 'h</div><div class="i">' + hi[0] +
      '</div><div class="v">' + Math.round(hr.temperature_2m[k]) + '°</div><div class="p">' +
      (p >= 20 ? p + '%' : '') + '</div></div>';
  }
  document.getElementById('hours').innerHTML = html;
}

function evHtml(e, now) {
  var s = new Date(e.start), en = new Date(e.end);
  var cls = 'ev' + (e.end <= now ? ' past' : (e.start <= now ? ' live' : ''));
  var when = e.allDay ? 'Journée' : hm(s);
  return '<div class="' + cls + '"><div class="bar" style="background:' + esc(e.color) + '"></div>' +
    '<div class="when">' + when + (e.allDay ? '' : '<br><span style="font-size:14px;color:#6c757d">' + hm(en) + '</span>') +
    '</div><div><div class="ttl">' + esc(e.title) + '</div>' +
    (e.location ? '<div class="loc">' + esc(e.location) + '</div>' : '') + '</div></div>';
}

function renderAgenda() {
  var now = Date.now(), t0 = dayStart(new Date()), d1 = t0 + 86400000, d2 = d1 + 86400000, d3 = d2 + 86400000;
  var groups = [[], [], []];
  for (var i = 0; i < DATA.events.length; i++) {
    var e = DATA.events[i];
    if (e.start < d1 && e.end > t0) groups[0].push(e);
    else if (e.start >= d1 && e.start < d2) groups[1].push(e);
    else if (e.start >= d2 && e.start < d3) groups[2].push(e);
  }
  var after = new Date(d2);
  var titles = ["Aujourd'hui", 'Demain', JOURS[after.getDay()] + ' ' + after.getDate()];
  var html = '';
  for (var g = 0; g < 3; g++) {
    if (g === 2 && !groups[2].length) continue;
    html += '<h2' + (g ? ' class="more"' : '') + '>' + titles[g] + '</h2>';
    if (!groups[g].length) html += '<div class="empty">Rien de prévu</div>';
    for (var j = 0; j < groups[g].length; j++) html += evHtml(groups[g][j], now);
  }
  document.getElementById('agenda').innerHTML = html;
}

// L'identifiant du script Google est dans le lien (#AKfy...), jamais dans ce fichier public.
function scriptId() {
  var h = (location.hash || '').replace(/^#/, '');
  try {
    if (h) localStorage.setItem('dash-id', h); else h = localStorage.getItem('dash-id') || '';
  } catch (e) {}
  return h;
}

function setStatus(txt, err) {
  var st = document.getElementById('status');
  st.className = 'status' + (err ? ' err' : '');
  st.textContent = txt;
}

var reqN = 0;
function load() {
  var id = scriptId();
  if (!id) {
    document.getElementById('agenda').innerHTML =
      '<h2>Configuration</h2><div class="empty">Ajoute l\'identifiant du script Google à la fin du lien : #AKfy…</div>';
    return;
  }
  var cbName = 'dashCb' + (++reqN), done = false;
  var s = document.createElement('script');
  function cleanup() {
    window[cbName] = function () {};
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  window[cbName] = function (d) {
    done = true; cleanup();
    DATA = d;
    renderWeather(d.weather);
    renderAgenda();
    setStatus('MAJ ' + hm(new Date()), false);
  };
  s.onerror = function () { if (!done) { done = true; cleanup(); setStatus('Hors ligne — nouvel essai bientôt', true); } };
  setTimeout(function () { if (!done) { done = true; cleanup(); setStatus('Pas de réponse — nouvel essai bientôt', true); } }, 60000);
  s.src = 'https://script.google.com/macros/s/' + encodeURIComponent(id) + '/exec?callback=' + cbName + '&t=' + Date.now();
  document.body.appendChild(s);
}

tick();
setInterval(tick, 1000);
load();
setInterval(load, 10 * 60 * 1000);                                   // données toutes les 10 min
setTimeout(function () { try { window.location.reload(); } catch (e) {} }, 6 * 3600 * 1000); // rechargement complet toutes les 6 h
</script>
</body>
</html>
